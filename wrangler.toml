name = "mindkeep-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Frontend origins allowed by CORS, comma-separated. "*" matches one subdomain (Pages preview deploys),
# e.g. "https://mindkeep.pages.dev,https://*.mindkeep.pages.dev,http://localhost:3000"
ALLOWED_ORIGIN = "https://mindkeep.vamsidhar.in,https://*.vamsubala1.workers.dev,http://localhost:3000"
# Your Firebase project id (Firebase console > Project settings). ID tokens are checked against it.
FIREBASE_PROJECT_ID = "mindkeep-d374f"

[[d1_databases]]
binding = "DB"
database_name = "mindkeep"
database_id = "c80789f2-961f-4c47-b402-6e952435f952"
migrations_dir = "migrations"
